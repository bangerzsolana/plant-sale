<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plant Sale — Get in Touch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-1: #e8f5d8;
    --bg-2: #d4ecbf;
    --leaf-dark: #3f6b3a;
    --leaf-mid: #5a8a4e;
    --leaf-light: #8fbf7f;
    --cream: #fdfcf3;
    --soil: #6b4a2b;
    --accent: #f4a1a1;
    --yellow: #f7d774;
    --shadow: rgba(63, 107, 58, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: 'Nunito', system-ui, -apple-system, sans-serif;
    color: var(--leaf-dark);
    background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
  }

  /* Decorative leaves in the corners */
  .leaf {
    position: absolute;
    pointer-events: none;
    opacity: 0.55;
    filter: drop-shadow(0 4px 10px var(--shadow));
  }
  .leaf.top-left { top: -30px; left: -30px; width: 180px; transform: rotate(-15deg); }
  .leaf.top-right { top: -40px; right: -40px; width: 200px; transform: rotate(35deg) scaleX(-1); }
  .leaf.bottom-left { bottom: -40px; left: -30px; width: 170px; transform: rotate(200deg); }
  .leaf.bottom-right { bottom: -30px; right: -30px; width: 190px; transform: rotate(-155deg); }

  @media (max-width: 600px) {
    .leaf.top-left { width: 110px; top: -20px; left: -25px; }
    .leaf.top-right { width: 130px; top: -25px; right: -30px; }
    .leaf.bottom-left { width: 110px; bottom: -25px; left: -25px; }
    .leaf.bottom-right { width: 120px; bottom: -20px; right: -25px; }
  }

  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    background: var(--cream);
    border-radius: 28px;
    padding: 40px 32px 36px;
    box-shadow:
      0 20px 50px -15px var(--shadow),
      0 4px 0 0 rgba(63, 107, 58, 0.08) inset;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--leaf-light);
    color: #2d4a28;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 800;
    font-size: clamp(28px, 6vw, 36px);
    margin: 0 0 28px;
    color: var(--leaf-dark);
    line-height: 1.15;
  }

  .subtitle {
    margin: 0 0 28px;
    font-size: 15px;
    color: #5a7250;
    line-height: 1.5;
  }

  .email-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--leaf-mid);
    text-align: left;
    margin-bottom: 8px;
  }

  .email-field {
    width: 100%;
    background: #fff;
    border: 2px solid var(--leaf-light);
    border-radius: 14px;
    padding: 16px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(14px, 4vw, 17px);
    color: var(--leaf-dark);
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.01em;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
  }

  .email-field:focus {
    border-color: var(--leaf-mid);
    box-shadow: 0 0 0 4px rgba(143, 191, 127, 0.25);
  }

  .copy-btn {
    margin-top: 16px;
    width: 100%;
    border: none;
    background: var(--leaf-mid);
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.02em;
    padding: 16px 20px;
    border-radius: 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 6px 0 -1px #3f6b3a, 0 10px 20px -8px var(--shadow);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .copy-btn:hover { background: #6c9c5d; }
  .copy-btn:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 -1px #3f6b3a, 0 4px 10px -4px var(--shadow);
  }

  .copy-btn.copied {
    background: var(--leaf-dark);
  }

  .copy-icon { width: 18px; height: 18px; }

  .footer {
    margin-top: 24px;
    font-size: 13px;
    color: #7a8f70;
    font-style: italic;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--leaf-dark);
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 99;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

  <!-- Corner leaf decorations -->
  <svg class="leaf top-left" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M20 180 C 20 80, 80 20, 180 20 C 160 110, 100 170, 20 180 Z" fill="#8fbf7f"/>
    <path d="M30 170 C 70 120, 120 80, 170 40" stroke="#3f6b3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M60 140 L 100 130 M 80 110 L 120 95 M 100 80 L 140 60" stroke="#3f6b3a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>

  <svg class="leaf top-right" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M20 180 C 20 80, 80 20, 180 20 C 160 110, 100 170, 20 180 Z" fill="#5a8a4e"/>
    <path d="M30 170 C 70 120, 120 80, 170 40" stroke="#3f6b3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M60 140 L 100 130 M 80 110 L 120 95 M 100 80 L 140 60" stroke="#3f6b3a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>

  <svg class="leaf bottom-left" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M20 180 C 20 80, 80 20, 180 20 C 160 110, 100 170, 20 180 Z" fill="#a8d195"/>
    <path d="M30 170 C 70 120, 120 80, 170 40" stroke="#3f6b3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M60 140 L 100 130 M 80 110 L 120 95 M 100 80 L 140 60" stroke="#3f6b3a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>

  <svg class="leaf bottom-right" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M20 180 C 20 80, 80 20, 180 20 C 160 110, 100 170, 20 180 Z" fill="#8fbf7f"/>
    <path d="M30 170 C 70 120, 120 80, 170 40" stroke="#3f6b3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M60 140 L 100 130 M 80 110 L 120 95 M 100 80 L 140 60" stroke="#3f6b3a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>

  <main class="card">
    <span class="badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
      Plant Sale
    </span>

    <h1>E-transfer Email</h1>

    <label class="email-label" for="email">Email address</label>
    <input
      id="email"
      class="email-field"
      type="email"
      value="silviaevastrobl@gmail.com"
      readonly
      onclick="this.select()"
      aria-label="Contact email"
    />

    <button id="copyBtn" class="copy-btn" type="button" aria-live="polite">
      <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      <span id="copyLabel">Copy email</span>
    </button>

    <p class="footer">
      <span aria-hidden="true">🌱</span> thanks for supporting local plants
    </p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    Email copied!
  </div>

<script>
  const EMAIL = 'silviaevastrobl@gmail.com';
  const btn = document.getElementById('copyBtn');
  const label = document.getElementById('copyLabel');
  const toast = document.getElementById('toast');
  let toastTimer = null;

  function showToast() {
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  async function copyEmail() {
    let ok = false;
    try {
      await navigator.clipboard.writeText(EMAIL);
      ok = true;
    } catch (e) {
      // Fallback for older browsers / non-secure contexts
      const input = document.getElementById('email');
      input.removeAttribute('readonly');
      input.select();
      input.setSelectionRange(0, EMAIL.length);
      try { ok = document.execCommand('copy'); } catch (_) {}
      input.setAttribute('readonly', '');
      input.blur();
    }
    if (ok) {
      btn.classList.add('copied');
      label.textContent = 'Copied!';
      showToast();
      setTimeout(() => {
        btn.classList.remove('copied');
        label.textContent = 'Copy email';
      }, 1800);
    } else {
      label.textContent = 'Press Ctrl/Cmd+C';
    }
  }

  btn.addEventListener('click', copyEmail);
</script>
</body>
</html>
